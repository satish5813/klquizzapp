# One Coolify app serves BOTH the API and the student client (same HTTPS origin).
# Build the React client (→ dist), then run the API server which serves dist.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
# full install (dev deps needed to build the client with vite/tsc)
cmds = ["npm ci"]

[phases.build]
# builds the student client into ./dist (vite only — skip tsc typecheck to keep the
# VPS build light/fast; the client is already type-checked before commit)
cmds = ["npx vite build"]

[start]
# Cluster bootstrap: one Node worker per vCPU (WEB_CONCURRENCY overrides).
# Uses all 4 vCPUs instead of one, so the API scales to thousands of students.
cmd = "node server/start.js"
